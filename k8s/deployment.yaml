apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: my-app
        image: DOCKER_HUB_USERNAME/my-app:latest  # Bu yer avtomatik yangilanadi
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: my-app-service
  namespace: default
spec:
  type: LoadBalancer # Yoki ClusterIP (Infrastrukturaga qarab)
  selector:
    app: my-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
